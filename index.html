<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ادارة راس المال و توزيع الراتب</title>
    <style>
        /* متغيرات الألوان للوضع الليلي */
        :root {
            --bg-color: #0a0a0a;
            --bg-gradient: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            --text-color: #ffffff;
            --text-secondary: #b8b8b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(0, 0, 0, 0.6);
            --accent-primary: #4ecdc4;
            --accent-secondary: #f5576c;
            --accent-tertiary: #f093fb;
            --shadow-color: rgba(78, 205, 196, 0.2);
            --glow-color: rgba(245, 87, 108, 0.3);
        }

        /* متغيرات الألوان للوضع النهاري */
        body.light-theme {
            --bg-color: #f4f6f8;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-color: #2d3436;
            --text-secondary: #636e72;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(255, 255, 255, 0.85);
            --accent-primary: #0984e3;
            --accent-secondary: #e17055;
            --accent-tertiary: #fd79a8;
            --shadow-color: rgba(9, 132, 227, 0.2);
            --glow-color: rgba(225, 112, 85, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gradient);
            color: var(--text-color); 
            padding: 20px; 
            min-height: 100vh; 
            font-size: 16px;
            transition: background 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        header { 
            text-align: center; 
            margin-bottom: 30px; 
            background: var(--header-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .top-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px var(--glow-color);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--glow-color);
        }

        .control-btn {
            padding: 10px 20px;
            border: 2px solid var(--card-border);
            border-radius: 25px;
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        #themeToggle {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            color: #fff;
            border: none;
        }

        header h1 { 
            font-size: 2.5rem; 
            background: linear-gradient(135deg, var(--accent-tertiary), var(--accent-secondary), var(--accent-primary));
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 10px;
        }

        .gallery-section { 
            margin-bottom: 50px; 
            background: var(--card-bg); 
            border-radius: 25px; 
            padding: 25px; 
            border: 1px solid var(--card-border);
            transition: transform 0.3s;
        }

        .gallery-section:hover {
            transform: translateY(-3px);
        }

        .gallery-section h2 { 
            text-align: center; 
            margin-bottom: 25px; 
            font-size: 1.8rem; 
            color: var(--text-color);
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .gallery-section h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
        }

        .slider-wrapper { 
            position: relative; 
            max-width: 900px; 
            margin: 0 auto; 
            background: var(--card-bg);
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid var(--card-border);
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            padding: 15px 20px; 
            background: var(--header-bg);
            border-bottom: 1px solid var(--card-border); 
            flex-wrap: wrap; 
            z-index: 10; 
            position: relative;
        }

        .controls button { 
            padding: 8px 18px; 
            border: none; 
            border-radius: 25px; 
            background: var(--accent-primary);
            color: #fff;
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .controls button:hover { 
            background: var(--accent-secondary);
            transform: scale(1.05);
        }

        .controls button.play-btn { 
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
        }

        .controls .counter { 
            background: var(--card-bg);
            padding: 6px 16px; 
            border-radius: 25px; 
            font-size: 0.9rem; 
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }
        
        .slider-container { 
            position: relative; 
            width: 100%; 
            height: 450px; 
            overflow: hidden; 
            background: #000;
        }

        .slide { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none; 
            transition: opacity 0.8s ease-in-out, visibility 0s linear 0.8s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #000;
            z-index: 1;
        }

        .slide.active { 
            opacity: 1; 
            visibility: visible; 
            pointer-events: auto; 
            transition: opacity 0.8s ease-in-out, visibility 0s linear 0s; 
            z-index: 2;
        }

        .slide img, .slide video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            cursor: zoom-in;
        }

        .slide .slide-title { 
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 25px; 
            border-radius: 25px; 
            font-size: 1rem; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap; 
            pointer-events: none; 
            z-index: 5; 
            color: #fff;
        }
        
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            background: rgba(0, 0, 0, 0.7);
            color: #fff; 
            border: none; 
            padding: 16px 14px; 
            font-size: 1.6rem; 
            cursor: pointer; 
            transition: all 0.3s;
            border-radius: 10px; 
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn:hover { 
            background: var(--accent-primary);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn.left { left: 15px; }
        .nav-btn.right { right: 15px; }
        
        .dots { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            padding: 15px 0; 
            background: var(--header-bg);
            border-top: 1px solid var(--card-border);
        }

        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer; 
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .dot:hover {
            background: var(--accent-primary);
            transform: scale(1.2);
        }

        .dot.active { 
            background: var(--accent-primary);
            border-color: #fff;
            transform: scale(1.4);
        }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            cursor: zoom-out; 
            padding: 20px;
        }

        .modal-content { 
            position: relative; 
            width: 95%; 
            max-width: 1200px; 
            height: 90vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .modal img, .modal video, .modal iframe { 
            max-width: 100%; 
            max-height: 100%; 
            border-radius: 15px;
        }

        .modal iframe { 
            width: 100%; 
            height: 100%; 
            border: none;
        }

        .close-modal { 
            position: absolute; 
            top: 25px; 
            right: 35px; 
            font-size: 3rem; 
            color: #fff; 
            cursor: pointer; 
            transition: all 0.3s;
            z-index: 1001;
        }

        .close-modal:hover { 
            color: var(--accent-secondary);
            transform: rotate(90deg) scale(1.2);
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 25px;
            background: var(--header-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 20px 20px 0 0;
            font-size: 1rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            body { padding: 15px; } 
            header h1 { font-size: 1.8rem; } 
            .gallery-section { padding: 15px; margin-bottom: 35px; } 
            .gallery-section h2 { font-size: 1.4rem; } 
            .slider-container { height: 320px; } 
            .controls { padding: 10px 15px; gap: 8px; } 
            .controls button { padding: 6px 14px; font-size: 0.8rem; } 
            .controls .counter { font-size: 0.8rem; padding: 5px 12px; } 
            .nav-btn { padding: 12px 10px; font-size: 1.3rem; } 
            .slide .slide-title { font-size: 0.85rem; padding: 8px 18px; bottom: 20px; white-space: normal; } 
            .dots { gap: 8px; padding: 10px 0; } 
            .dot { width: 10px; height: 10px; } 
            .modal-content { height: 80vh; } 
            .close-modal { font-size: 2.2rem; top: 15px; right: 25px; }
            .download-btn { font-size: 0.9rem; padding: 10px 18px; }
            .control-btn { padding: 8px 16px; font-size: 0.85rem; }
        }

        @media (max-width: 480px) { 
            .slider-container { height: 240px; } 
            .top-controls { gap: 10px; }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="top-controls">
            <a href="assets/files/ادارة راس المال.xlsx" download class="download-btn">
                📥 تحميل الملف اضغط هنا "ادارة راس المال.xlsx"
            </a>
            <button id="themeToggle" class="control-btn">🌙 الوضع النهاري</button>
            <button id="fontDecrease" class="control-btn" title="تصغير الخط">A-</button>
            <button id="fontIncrease" class="control-btn" title="تكبير الخط">A+</button>
        </div>
        <h1>ادارة راس المال و توزيع الراتب</h1>
    </header>

    <!-- ===== قسم الصور ===== -->
    <section class="gallery-section">
        <h2>🖼️ صور عن الملف</h2>
        <div class="slider-wrapper">
            <div class="controls">
                <button class="play-btn" id="imagePlayBtn">⏸️ إيقاف</button>
                <button id="imagePrevBtn">⏪ السابق</button>
                <button id="imageNextBtn">التالي ⏩</button>
                <span class="counter" id="imageCounter">1 / 6</span>
            </div>
            <button class="nav-btn left" id="imageLeftNav">❮</button>
            <button class="nav-btn right" id="imageRightNav">❯</button>
            <div class="slider-container" id="imageSliderContainer">
                <div id="imageSlidesContainer"></div>
            </div>
            <div class="dots" id="imageDotsContainer"></div>
        </div>
    </section>

    <!-- ===== قسم الفيديوهات ===== -->
    <section class="gallery-section">
        <h2>🎬 فيديو شرح الاستخدام</h2>
        <div class="slider-wrapper">
            <div class="controls">
                <button id="videoPrevBtn">⏪ السابق</button>
                <button id="videoNextBtn">التالي ⏩</button>
                <span class="counter" id="videoCounter">1 / 3</span>
            </div>
            <button class="nav-btn left" id="videoLeftNav">❮</button>
            <button class="nav-btn right" id="videoRightNav">❯</button>
            <div class="slider-container" id="videoSliderContainer">
                <div id="videoSlidesContainer"></div>
            </div>
            <div class="dots" id="videoDotsContainer"></div>
        </div>
    </section>

    <!-- ===== نافذة التكبير ===== -->
    <div class="modal" id="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="صورة مكبرة" style="display:none;" />
            <video id="modalMp4" controls style="display:none; max-width: 100%; max-height: 100%; border-radius: 15px;"></video>
            <iframe id="modalVideo" src="" allowfullscreen style="display:none;"></iframe>
        </div>
    </div>

    <footer>
        تم عمل الموقع بواسطة muharraqi و جميع الحقوق محفوظة &copy; 2026
    </footer>

    <script src="script.js"></script>
</body>
</html>
