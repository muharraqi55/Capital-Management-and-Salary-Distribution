<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>معرض الصور والفيديوهات</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>📸 معرض الصور والفيديوهات</h1>
    </header>

    <!-- ===== قسم الصور ===== -->
    <section class="gallery-section">
        <h2>🖼️ ألبوم الصور</h2>
        <div class="slider-wrapper">
            <!-- شريط التحكم العلوي للصور -->
            <div class="controls" id="imageControls">
                <button id="imagePlayBtn">⏸️ إيقاف</button>
                <button id="imagePrevBtn">⏪ السابق</button>
                <button id="imageNextBtn">التالي ⏩</button>
                <span id="imageCounter">1 / 6</span>
            </div>

            <!-- أزرار التنقل الجانبية للصور -->
            <button class="nav-btn left" id="imageLeftNav">❮</button>
            <button class="nav-btn right" id="imageRightNav">❯</button>

            <!-- حاوية الشرائح للصور -->
            <div class="slider-container" id="imageSliderContainer">
                <div id="imageSlidesContainer"></div>
            </div>

            <!-- نقاط التقدم للصور -->
            <div class="dots" id="imageDotsContainer"></div>
        </div>
    </section>

    <!-- ===== قسم الفيديوهات ===== -->
    <section class="gallery-section">
        <h2>🎬 ألبوم فيديوهات YouTube</h2>
        <div class="slider-wrapper">
            <!-- شريط التحكم العلوي للفيديوهات -->
            <div class="controls" id="videoControls">
                <button id="videoPrevBtn">⏪ السابق</button>
                <button id="videoNextBtn">التالي ⏩</button>
                <span id="videoCounter">1 / 2</span>
            </div>

            <!-- أزرار التنقل الجانبية للفيديوهات -->
            <button class="nav-btn left" id="videoLeftNav">❮</button>
            <button class="nav-btn right" id="videoRightNav">❯</button>

            <!-- حاوية الشرائح للفيديوهات -->
            <div class="slider-container" id="videoSliderContainer">
                <div id="videoSlidesContainer"></div>
            </div>

            <!-- نقاط التقدم للفيديوهات -->
            <div class="dots" id="videoDotsContainer"></div>
        </div>
    </section>

    <!-- ===== نافذة التكبير الموحدة ===== -->
    <div class="modal" id="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="صورة مكبرة" />
            <iframe id="modalVideo" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
