<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>معرض الصور والفيديوهات</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- شريط التحكم العلوي -->
    <div class="controls">
        <button id="playBtn">⏸️ إيقاف</button>
        <button id="prevBtn">⏪ السابق</button>
        <button id="nextBtn">التالي ⏩</button>
        <span id="counter">1 / 10</span>
    </div>

    <!-- أزرار التنقل الجانبية -->
    <button class="nav-btn left" id="leftNav">❮</button>
    <button class="nav-btn right" id="rightNav">❯</button>

    <!-- حاوية الشرائح -->
    <div class="slider-container">
        <div id="slidesContainer"></div>
    </div>

    <!-- نقاط التقدم -->
    <div class="dots" id="dotsContainer"></div>

    <!-- نافذة التكبير -->
    <div class="modal" id="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img id="modalImage" src="" alt="صورة مكبرة" />
    </div>

    <script src="script.js"></script>
</body>
</html>
