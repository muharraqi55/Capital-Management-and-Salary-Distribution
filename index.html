<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>معرض الصور والفيديوهات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; padding: 20px; min-height: 100vh; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; background: linear-gradient(135deg, #f093fb, #f5576c, #4ecdc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gallery-section { margin-bottom: 50px; background: rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .gallery-section h2 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; color: #ddd; }
        .slider-wrapper { position: relative; max-width: 900px; margin: 0 auto; background: #0a0a0a; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
        .controls { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 12px 20px; background: rgba(0, 0, 0, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; z-index: 10; position: relative; }
        .controls button { padding: 6px 16px; border: none; border-radius: 20px; background: #4ecdc4; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.85rem; }
        .controls button:hover { background: #f5576c; color: #fff; transform: scale(1.05); }
        .controls button.play-btn { background: linear-gradient(135deg, #f5576c, #f093fb); color: #fff; }
        .controls .counter { background: rgba(255, 255, 255, 0.1); padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; color: #aaa; }
        .slider-container { position: relative; width: 100%; height: 400px; overflow: hidden; background: #0a0a0a; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.8s ease-in-out, visibility 0s linear 0.8s; display: flex; align-items: center; justify-content: center; background: #0a0a0a; z-index: 1; }
        .slide.active { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.8s ease-in-out, visibility 0s linear 0s; z-index: 2; }
        .slide img, .slide video { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
        .slide .slide-title { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.1); white-space: nowrap; pointer-events: none; z-index: 5; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.6); color: #fff; border: none; padding: 14px 12px; font-size: 1.5rem; cursor: pointer; transition: 0.3s; border-radius: 8px; backdrop-filter: blur(5px); z-index: 10; }
        .nav-btn:hover { background: rgba(78, 205, 196, 0.7); transform: translateY(-50%) scale(1.1); }
        .nav-btn.left { left: 10px; }
        .nav-btn.right { right: 10px; }
        .dots { display: flex; justify-content: center; gap: 10px; padding: 12px 0; background: rgba(0, 0, 0, 0.8); border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .dot.active { background: #4ecdc4; border-color: #fff; transform: scale(1.3); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; backdrop-filter: blur(10px); padding: 20px; }
        .modal-content { position: relative; width: 95%; max-width: 1200px; height: 90vh; display: flex; align-items: center; justify-content: center; }
        .modal img, .modal video, .modal iframe { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 0 60px rgba(78, 205, 196, 0.2); }
        .modal iframe { width: 100%; height: 100%; border: none; }
        .close-modal { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: #fff; cursor: pointer; transition: 0.3s; z-index: 1001; }
        .close-modal:hover { color: #f5576c; transform: rotate(90deg); }
        @media (max-width: 768px) {
            body { padding: 10px; } header h1 { font-size: 1.8rem; } .gallery-section { padding: 10px; margin-bottom: 30px; } .gallery-section h2 { font-size: 1.3rem; } .slider-container { height: 280px; } .controls { padding: 8px 12px; gap: 6px; } .controls button { padding: 4px 10px; font-size: 0.7rem; } .controls .counter { font-size: 0.7rem; padding: 3px 10px; } .nav-btn { padding: 10px 8px; font-size: 1.2rem; } .slide .slide-title { font-size: 0.75rem; padding: 5px 15px; bottom: 15px; white-space: normal; } .dots { gap: 6px; padding: 8px 0; } .dot { width: 8px; height: 8px; } .modal-content { height: 80vh; } .close-modal { font-size: 2rem; top: 10px; right: 20px; }
        }
        @media (max-width: 480px) { .slider-container { height: 200px; } }
    </style>
</head>
<body>
    <header>
        <h1>📸 معرض الصور والفيديوهات</h1>
    </header>

    <!-- ===== قسم الصور ===== -->
    <section class="gallery-section">
        <h2>🖼️ ألبوم الصور</h2>
        <div class="slider-wrapper">
            <div class="controls">
                <button class="play-btn" id="imagePlayBtn">⏸️ إيقاف</button>
                <button id="imagePrevBtn">⏪ السابق</button>
                <button id="imageNextBtn">التالي ⏩</button>
                <span class="counter" id="imageCounter">1 / 6</span>
            </div>
            <button class="nav-btn left" id="imageLeftNav">❮</button>
            <button class="nav-btn right" id="imageRightNav">❯</button>
            <div class="slider-container" id="imageSliderContainer">
                <div id="imageSlidesContainer"></div>
            </div>
            <div class="dots" id="imageDotsContainer"></div>
        </div>
    </section>

    <!-- ===== قسم الفيديوهات (يوتيوب + MP4) ===== -->
    <section class="gallery-section">
        <h2>🎬 ألبوم الفيديوهات</h2>
        <div class="slider-wrapper">
            <div class="controls">
                <button id="videoPrevBtn">⏪ السابق</button>
                <button id="videoNextBtn">التالي ⏩</button>
                <span class="counter" id="videoCounter">1 / 3</span>
            </div>
            <button class="nav-btn left" id="videoLeftNav">❮</button>
            <button class="nav-btn right" id="videoRightNav">❯</button>
            <div class="slider-container" id="videoSliderContainer">
                <div id="videoSlidesContainer"></div>
            </div>
            <div class="dots" id="videoDotsContainer"></div>
        </div>
    </section>

    <!-- ===== نافذة التكبير ===== -->
    <div class="modal" id="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-content">
            <!-- عنصر للصورة -->
            <img id="modalImage" src="" alt="صورة مكبرة" style="display:none;" />
            <!-- عنصر جديد لفيديو MP4 المحلي -->
            <video id="modalMp4" controls style="display:none; max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 0 60px rgba(78, 205, 196, 0.2);"></video>
            <!-- عنصر لفيديو يوتيوب -->
            <iframe id="modalVideo" src="" allowfullscreen style="display:none;"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
